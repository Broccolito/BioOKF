name: release

# Build the prebuilt macOS BioOKF bundle (bokf CLI + bokf-mcp server + BioOKF
# Studio desktop app) as a tag-time verification build.
#
# This workflow does NOT publish release assets. Its runners hold no Developer ID
# certificate, so everything it produces is unsigned (`--no-sign`). Studio's
# in-app updater installs into /Applications with administrator rights and
# therefore refuses any bundle that fails `codesign --verify`; publishing an
# unsigned archive here silently breaks self-update for every existing user.
#
# The macOS release assets — the signed/notarized/stapled DMGs *and* the
# `biookf-<target>.tar.gz` archives the `biookf` Claude Code plugin downloads —
# are built, signed, notarized, and uploaded from a machine holding the UCSF
# Developer ID certificate. See `notarization/notarization.md`.
#
# Trigger: push a tag like `v0.1.0`, or run manually with a tag input.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build against (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  # Cheap text-only gate, ahead of any macOS runner time: the tag being built
  # must agree with every version string in the repo, and the plugin launcher
  # must still resolve its binary in the documented order.
  checks:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Every version must match the tag
        run: ./scripts/check-versions.sh "${{ steps.tag.outputs.tag }}"

      - name: MCP launcher resolution order
        run: ./plugins/biookf/scripts/tests/test-launcher.sh

  build:
    name: build (${{ matrix.target }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon
            target: macos-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel # Intel
            target: macos-x64
            rust_target: x86_64-apple-darwin

    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # Linux Tauri runtime/build deps (WebKitGTK etc.)
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install tauri-cli
        if: startsWith(matrix.os, 'macos-')
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build bokf + bokf-mcp (release)
        working-directory: app
        run: cargo build --release -p bokf-cli -p bokf-mcp

      - name: Prepare Studio sidecars
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p studio/src-tauri/bin
          cp target/release/bokf studio/src-tauri/bin/bokf
          cp target/release/bokf-mcp studio/src-tauri/bin/bokf-mcp

      - name: Build BioOKF Studio app (release)
        working-directory: app
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            ( cd studio/src-tauri && cargo tauri build --bundles app --no-sign --ci )
          else
            cargo build --release -p biookf-studio
          fi

      - name: Stage package
        id: stage
        working-directory: app
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/biookf-${{ matrix.target }}"
          rm -rf "$STAGE"; mkdir -p "$STAGE/bin"
          EXE=""
          if [ "${{ matrix.os }}" = "windows-2022" ]; then EXE=".exe"; fi
          cp "target/release/bokf$EXE"     "$STAGE/bin/"
          cp "target/release/bokf-mcp$EXE" "$STAGE/bin/"

          case "${{ matrix.target }}" in
            macos-*)
              # ship the self-contained .app bundle
              cp -R "target/release/bundle/macos/BioOKF Studio.app" "$STAGE/"
              ;;
            *)
              # ship the bare Studio executable (Linux needs WebKitGTK at runtime)
              cp "target/release/biookf-studio$EXE" "$STAGE/bin/"
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/dist"
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            ASSET="$RUNNER_TEMP/dist/biookf-${{ matrix.target }}.zip"
            ( cd "$STAGE" && 7z a -tzip "$ASSET" . >/dev/null )
          else
            ASSET="$RUNNER_TEMP/dist/biookf-${{ matrix.target }}.tar.gz"
            tar -czf "$ASSET" -C "$STAGE" .
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      # Kept as a build artifact for debugging only. Uploading this to the
      # release would replace the signed archive and break Studio's updater,
      # which requires a bundle that passes `codesign --verify`.
      - name: Upload verification build
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: ${{ steps.stage.outputs.asset }}
          retention-days: 7
