[package]
name = "spoke-fabric"
version = "0.1.0"
edition = "2021"
description = "BioOKF -> SPOKE mapping fabric (native Rust; Bolt connection as a subcommand)"

[[bin]]
name = "spoke-fabric"
path = "src/main.rs"

[dependencies]
neo4rs = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
dotenvy = "0.15"
futures = "0.3"
sha2 = "0.10"
unicode-normalization = "0.1"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
