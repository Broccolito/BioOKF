[metadata]
name = paperclip-biookf-harness
version = 0.1.0
description = A provenance-first bridge from Paperclip evidence to BioOKF Studio bundles
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
paperclip_biookf = ui/*.html

[options.entry_points]
console_scripts =
    pc-biookf = paperclip_biookf.cli:main
