<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BioOKF metagraph</title>
  <desc id="desc">The 28 BioOKF node types grouped into seven families, representative typed edges, and the complete vocabulary of 24 positive and 11 negative predicates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#747A85"/></marker>
    <marker id="arrow-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B54A42"/></marker>
    <style>
      .family{fill:#FAFAFB;stroke:#E1E3E7;stroke-width:1.5}.family-title{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px;fill:#8B8EA0}.node{stroke:#343941;stroke-opacity:.42;stroke-width:1.3}.node-label{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242A;text-anchor:middle}.edge{fill:none;stroke:#747A85;stroke-width:1.6;stroke-opacity:.58;marker-end:url(#arrow)}.edge.neg{stroke:#B54A42;stroke-dasharray:7 5;marker-end:url(#arrow-neg)}.edge-label{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4E5560;text-anchor:middle;paint-order:stroke;stroke:#FFF;stroke-width:5px;stroke-linejoin:round}.edge-label.neg{fill:#A3403B}.legend-title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242A}.legend-head{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#777D89}.legend-text{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#353B44}.legend-neg{fill:#A3403B}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#777D89}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text x="42" y="28" class="small">BIOOKF v0.5 · 28 NODE TYPES · 35 PREDICATES · SUBJECT → OBJECT</text>

