<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">BioOKF metagraph network mockup</title>
  <desc id="desc">A force-directed-style mockup showing all 28 BioOKF node types as symbolic meta-nodes and representative combinations of positive and negated typed edges.</desc>
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#E9EAED"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7D838D"/></marker>
    <marker id="arrow-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C56B65"/></marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#181B20" flood-opacity=".13"/></filter>
    <style>
      .edge{fill:none;stroke:#7D838D;stroke-width:2;stroke-opacity:.40;marker-end:url(#arrow)}
      .edge.strong{stroke-width:2.7;stroke-opacity:.57}
      .edge.neg{stroke:#C56B65;stroke-width:2;stroke-opacity:.58;stroke-dasharray:8 7;marker-end:url(#arrow-neg)}
      .edge-label{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#555B65;text-anchor:middle;paint-order:stroke;stroke:#FFF;stroke-width:7px;stroke-linejoin:round}
      .edge-label.neg{fill:#B3534D}
      .node{stroke:#282D34;stroke-width:2;filter:url(#shadow)}
      .node-label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242A;paint-order:stroke;stroke:#FFF;stroke-width:6px;stroke-linejoin:round}
      .node-label.small{font-size:14px}
      .eyebrow{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px;fill:#8B8EA0}
      .headline{font:650 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242A}
      .key{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6E7480}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#FFFFFF"/>
  <rect width="1800" height="1200" fill="url(#dots)" opacity=".72"/>
  <text x="52" y="55" class="eyebrow">BIOOKF · SCHEMA-LEVEL NETWORK MOCKUP</text>
  <text x="52" y="88" class="headline">28 symbolic node types connected through representative typed predicates</text>
  <g transform="translate(1320 48)"><line x1="0" y1="0" x2="42" y2="0" class="edge" marker-end="none"/><text x="52" y="5" class="key">positive predicate</text><line x1="202" y1="0" x2="244" y2="0" class="edge neg" marker-end="none"/><text x="254" y="5" class="key">refuted finding · not_*</text></g>

