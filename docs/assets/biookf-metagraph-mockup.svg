    <path class="edge" d="M663 889 Q677 645 779 411"/><text class="edge-label" x="689" y="657">used_to_study</text>
    <path class="edge" d="M608 1082 Q713 1082 813 1083"/><text class="edge-label" x="712" y="1069">reported_in</text>
    <path class="edge" d="M1004 1080 Q936 979 871 870"/><text class="edge-label" x="929" y="979">derives_from</text>
