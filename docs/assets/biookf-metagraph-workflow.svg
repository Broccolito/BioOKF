    <circle class="node" cx="750" cy="450" r="43" fill="#2E8C84"/><text class="label" x="802" y="457">Molecule</text>
    <circle class="node" cx="880" cy="225" r="35" fill="#4FA38C"/><text class="label small" x="923" y="231">BiologicalPathway</text>
    <circle class="node" cx="1050" cy="170" r="31" fill="#7CC3B0"/><text class="label small" x="1089" y="176">BiologicalFunction</text>
