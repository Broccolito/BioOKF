<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BioOKF compact workflow metagraph</title>
  <desc id="desc">A stylized dense knowledge graph with 15 symbolic BioOKF node types and representative positive, negative, and provenance edges.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#727985"/></marker>
    <marker id="arrow-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C36A64"/></marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#15181D" flood-opacity=".14"/></filter>
    <style>
      .edge{fill:none;stroke:#727985;stroke-width:2;stroke-opacity:.31;marker-end:url(#arrow)}
      .edge.main{stroke-width:2.8;stroke-opacity:.58}.edge.prov{stroke:#8C929C;stroke-width:1.5;stroke-opacity:.18}
      .edge.neg{stroke:#C36A64;stroke-width:2;stroke-opacity:.56;stroke-dasharray:7 6;marker-end:url(#arrow-neg)}
      .edge-label{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#505762;text-anchor:middle;paint-order:stroke;stroke:#FFF;stroke-width:7px;stroke-linejoin:round}
      .edge-label.neg{fill:#B14F49}.edge-label.prov{fill:#747B86}
      .node{stroke:#292E35;stroke-width:2.2;filter:url(#shadow)}
      .label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20242A;paint-order:stroke;stroke:#FFF;stroke-width:7px;stroke-linejoin:round}
      .label.small{font-size:14px}.eyebrow{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px;fill:#858A98}
      .subtitle{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#747A85}.key{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#747A85}
    </style>
  </defs>

